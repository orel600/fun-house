<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>זירת המקל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&family=Secular+One&display=swap">
<link rel="stylesheet" href="css/style.css">

<!-- הטקסטים לא כתובים כאן: data-t ו-data-ta מתמלאים מהטבלה ב-js/lang.js, לפי השפה -->
<canvas id="c" data-ta="arena"></canvas>

<div class="hud">
  <div class="xpbar"><div class="xpfill" id="xp"></div><span class="bartxt" id="xpTxt"></span></div>
  <div class="row">
    <div class="hp"><div class="hpfill" id="hp"></div><span class="bartxt" id="hpTxt"></span></div>
    <div class="clock"><span id="clock">0:00</span><small id="bossin"></small></div>
    <div class="lvl" id="lvl"></div>
    <button class="gearbtn" id="gearBtnRun" data-ta="gear.btn">🎒</button>
  </div>
  <div class="bossbar" id="bossbar" hidden>
    <div class="bossname"><span id="bossnm"></span><em id="bossweak"></em></div>
    <div class="bosstrack"><div class="bossfill" id="bossfill"></div></div>
    <div class="ragetrack" id="ragetrack" hidden><div class="ragefill" id="ragefill"></div></div>
  </div>
  <div class="qtrack" id="qTrack" hidden></div>
</div>

<button class="swap" id="swap" data-ta="swapWeapon">
  <svg id="ico" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></svg>
  <span id="swaplbl"></span>
</button>

<button class="mute" id="muteBtn" data-ta="mute"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg></button>
<!-- הכפר: התרמיל למעלה, והפאנל של המבנה שלידו למטה (js/village.js) -->
<div class="vhud" id="vhud" hidden><div class="bag" id="vBag" role="group" data-ta="bagGroup"></div><button class="gearbtn" id="gearBtn">🎒 <span data-t="gear.btn"></span></button>
  <!-- הקווסטים: כפתור היומן בפינה, והיומן עצמו (js/quests.js) -->
  <button class="qbtn" id="qBtn"><span aria-hidden="true">📜</span> <span data-t="q.log"></span><b id="qBadge" hidden></b></button>
  <div class="qlog" id="qLog" hidden></div>
</div>
<div class="vpanel" id="vPanel" hidden></div>

<div class="banner" id="banner"></div>

<!-- מסך הציוד והתרמיל: המשבצות, התרמיל וההשוואה (js/gear.js) -->
<div class="ov gearov" id="ovGear" hidden>
  <div class="panel gearpanel">
    <div class="ghead"><h2 data-t="gear.title"></h2><span id="gHero"></span><button class="gclose" id="gearClose" data-ta="gear.close">✕</button></div>
    <div id="gSlots"></div>
    <div class="bag gres" id="gRes" role="group" data-ta="bagGroup"></div>
    <div class="gitems" id="gItems"></div>
    <div class="gdetail" id="gDetail"></div>
  </div>
</div>

<div class="ov" id="ovStart">
  <div class="panel">
    <div class="langs" role="group" data-ta="langGroup">
      <button class="lang" data-lang="he" lang="he">עברית</button>
      <button class="lang" data-lang="en" lang="en">English</button>
    </div>
    <div class="langs gfx" role="group" data-ta="gfxGroup">
      <button class="lang" data-gfx="3d" data-t="gfx3d"></button>
      <button class="lang" data-gfx="2d" data-t="gfx2d"></button>
    </div>
    <h1 data-t="title"></h1>
    <p class="sub" data-t="tagline"></p>
    <ul class="rules" data-t="rules"></ul>
    <button class="go" id="startBtn" data-t="start"></button>
    <p class="sub" id="bestLine"></p>
  </div>
</div>

<div class="ov" id="ovLevel" hidden>
  <div class="panel">
    <h2 id="lvTitle"></h2>
    <p class="sub" data-t="pickUpgrade"></p>
    <div class="cards" id="cards"></div>
  </div>
</div>

<div class="ov" id="ovBoss" hidden>
  <div class="panel">
    <p class="sub" data-t="bossComing"></p>
    <h2 id="bTitle"></h2>
    <div class="learned">
      <span class="k" data-t="bossLearned"></span>
      <div id="bLearned" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>
    <div class="learned">
      <span class="k" data-t="bossPats"></span>
      <div class="chips" id="bPats"></div>
      <span id="bWeak"></span>
    </div>
    <button class="go" id="fightBtn" data-t="fight"></button>
  </div>
</div>

<div class="ov" id="ovOver" hidden>
  <div class="panel">
    <h2 id="overTitle" data-t="fell"></h2>
    <div class="stats">
      <div class="stat"><span data-t="statTime"></span><b id="sTime">0:00</b></div>
      <div class="stat"><span data-t="statLevel"></span><b id="sLvl">1</b></div>
      <div class="stat"><span data-t="statBosses"></span><b id="sBoss">0</b></div>
      <div class="stat"><span data-t="statBest"></span><b id="sBest">0:00</b></div>
      <div class="stat"><span data-t="statCoins"></span><b id="sCoins">0</b></div>
      <div class="stat"><span data-t="statPicks"></span><b id="sPicks">0</b></div>
      <div class="stat wide"><span data-t="statLoot"></span><b id="sLoot" class="bag"></b></div>
    </div>
    <p class="sub" data-t="nextRun"></p>
    <button class="go" id="againBtn" data-t="toVillage"></button>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/lang.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/state.js"></script>
<script src="js/spawn.js"></script>
<script src="js/combat.js"></script>
<script src="js/boss.js"></script>
<script src="js/progression.js"></script>
<script src="js/bonus.js"></script>
<script src="js/wanted.js"></script>
<script src="js/village.js"></script>
<script src="js/quests.js"></script>
<script src="js/gear.js"></script>
<script src="js/stash.js"></script>
<script src="js/update.js"></script>
<script src="js/rig.js"></script>
<script src="js/fx.js"></script>
<script src="js/vendor/three-bundle.js"></script>
<script src="js/models3d.js"></script>
<script src="js/render3d.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>

</body></html>
