<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- התקנה כאפליקציה בטלפון (js/pwa.js) -->
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#121624">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Six Lanterns">
<title>Six Lanterns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&family=Secular+One&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/bwin.css">
<link rel="stylesheet" href="css/deco.css">
<link rel="stylesheet" href="css/itemtip.css">
<link rel="stylesheet" href="css/rarity.css">
<link rel="stylesheet" href="css/itemcard.css">
<link rel="stylesheet" href="css/credits.css">
<link rel="stylesheet" href="css/short.css">
<link rel="stylesheet" href="css/fxui.css">

<!-- הטקסטים לא כתובים כאן: data-t ו-data-ta מתמלאים מהטבלה ב-js/lang.js, לפי השפה -->
<canvas id="c" data-ta="arena"></canvas>

<div class="hud">
  <div class="xpbar"><div class="xpfill" id="xp"></div><small class="xptag" data-t="xp.tag"></small><span class="bartxt" id="xpTxt"></span></div>
  <div class="row">
    <div class="hp"><div class="hpfill" id="hp"></div><span class="bartxt" id="hpTxt"></span></div>
    <div class="clock"><span id="clock">0:00</span><small id="bossin"></small></div>
    <div class="lvl" id="lvl"></div>
    <b class="ascb" id="ascB" data-ta="ascale.tip" hidden></b>
    <button class="gearbtn" id="gearBtnRun" data-ta="gear.btn">🎒</button>
    <button class="gearbtn shopbtn" id="shopBtn" data-ta="shop.title" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 8v8M9.5 10h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><b>0</b></button>
  </div>
  <div class="runbar" id="runbar" data-ta="runbar.tip"><div class="runfill" id="runfill"></div></div>
  <div class="bossbar" id="bossbar" hidden>
    <div class="bossname"><span id="bossnm"></span><em id="bossweak"></em></div>
    <div class="bosstrack"><div class="bossfill" id="bossfill"></div></div>
    <div class="ragetrack" id="ragetrack" hidden><div class="ragefill" id="ragefill"></div></div>
  </div>
  <div class="qtrack" id="qTrack" hidden></div>
</div>

<button class="swap" id="swap" data-ta="swapWeapon">
  <svg id="ico" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></svg>
  <span id="swaplbl"></span>
</button>
<!-- הסקילים: עד 3 כפתורים בצד ימין למטה, בזירה ובעולם (js/skills.js, ובעולם גם js/wskill.js) -->
<button class="divine" id="divine" type="button" hidden></button>
<div class="skills" id="skills" role="group" data-ta="sk.group" hidden></div>
<!-- אולטימייט (js/ult.js): משמאל לקשת של הסקילים, מתמלא מהריגות -->
<button class="ult" id="ult" type="button" data-ta="ult.name" hidden><svg class="dti" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2l2.2 6.3L21 9l-5.2 4.3L17.5 21 12 17.3 6.5 21l1.7-7.7L3 9l6.8-.7z"/></svg><i></i></button>
<!-- כישוף מיוחד (js/spell.js): כפתור קטן ליד הסקילים, ובתחילת ריצה שלושה סמלים לבחירה מעליו -->
<button class="spellb" id="spell" type="button" hidden></button>
<!-- סקיל החתימה של הדרגה (js/sigskill.js): בעולם ובכפר, במקום של האולטימייט -->
<button class="sig" id="sig" type="button" hidden></button>

<button class="mute" id="muteBtn" data-ta="mute"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg></button>
<!-- הכפר: פס עליון בשורה אחת (המשאבים החשובים, השאר בתרמיל), והפאנל של המבנה שלידו (js/village.js) -->
<div class="vhud" id="vhud" hidden><div class="bag tbar" id="vBag" role="group" data-ta="bagGroup"></div></div>
<div class="vpanel win" id="vPanel" hidden></div>
<!-- העולם הפתוח: שם האזור ומה שבתרמיל למעלה, ופאנל ליד שער (js/world.js) -->
<div class="whud" id="whud" hidden><b id="wName"></b><b id="wSec" class="wsec"></b><span class="chtag" id="chTag" hidden></span><div class="bag tbar" id="wBag" role="group" data-ta="bagGroup"></div></div>
<div class="vpanel win" id="wPanel" hidden></div>
<!-- המטרה הבאה (js/guide.js): שורה אחת למעלה, בכפר ובעולם. נגיעה פותחת את היומן, ▴ מכווץ -->
<div class="guide" id="guide" hidden><button class="gmain" id="guideMain" type="button" data-ta="g.tap"><span class="gico" id="guideIco"></span><span class="gtxt" id="guideTxt"></span><b class="gdist" id="guideDist"></b></button><button class="gjump" id="guideJump" type="button" hidden></button><button class="gmin" id="guideMin" type="button"></button></div>
<div class="grare" id="rareLine" hidden></div>
<!-- הפינות העליונות בכפר ובעולם (js/minimap.js): "מי אני" (רמה, חיים, XP) בתחילת השורה, ומפה קטנה עגולה מתחת ל-☰ בעולם. נגיעה במפה פותחת את מפת העולם -->
<div class="who" id="who" role="img" hidden><b class="wlv" id="whoLv"></b><div class="wbars"><div class="whp"><i id="whoHp"></i></div><div class="wxp"><i id="whoXp"></i></div></div></div>
<button class="minimap" id="miniMap" data-ta="mm.open" hidden><canvas id="mmC"></canvas></button>
<!-- מפת העולם (js/worldmap.js): חלון עם מפה של כל האזורים ושל האזור הנוכחי. נפתח מהתפריט הראשי -->
<div class="qlog win wmapwin" id="wMap" hidden></div>
<!-- קפיצה בין פנסים (js/travel.js): הבזק אור בצבע הפנס על כל המסך -->
<div class="trflash" id="trFlash" hidden></div>
<!-- סרגל למטה, בכפר ובעולם: רק מה ששייך למקום שבו עומדים ("לדבר" ליד דמות, לדוג ליד מים, קפיצה ליד פנס). הוא לא מכסה אף חלון -->
<nav class="bnav" id="nav">
  <button class="nbtn talkbtn" id="talkBtn" hidden></button>
  <button class="nbtn talkbtn feedbtn" id="feedBtn" hidden></button>
  <button class="nbtn talkbtn fishbtn" id="fishBtn" hidden></button>
  <button class="nbtn talkbtn trbtn" id="trBtn" hidden></button>
  <button class="nbtn talkbtn trbtn" id="wsBtn" hidden></button>
  <button class="nbtn talkbtn" id="bellBtn" hidden></button>   <!-- פעמון הערפל באגם (js/lake-bell.js) -->
</nav>
<!-- התפריט הראשי (js/menu.js): ☰ בפינה העליונה, בכפר ובעולם, ומסך מלא עם לשוניות בצד. כל לשונית מציגה חלון קיים -->
<button class="mute menubtn" id="menuBtn" data-ta="set.title"><span aria-hidden="true">☰</span><b hidden></b></button>
<div class="menubg" id="menuBg"></div>
<nav class="mrail" id="menuRail" role="tablist" data-ta="menu.btn">
  <button class="mtab" id="gearBtn" role="tab"><span class="ni" aria-hidden="true">🎒</span><span data-t="menu.hero"></span><b id="gBadge" hidden></b><i class="mdot" id="skDot" hidden></i></button>
  <button class="mtab" id="qBtn" role="tab"><span class="ni" aria-hidden="true">📜</span><span data-t="q.log"></span><b id="qBadge" hidden></b></button>
  <button class="mtab" id="bookBtn" role="tab"><span class="ni" aria-hidden="true">📖</span><span data-t="book.btn"></span><b id="bBadge" hidden></b></button>
  <button class="mtab" id="wMapBtn" role="tab"><span class="ni" aria-hidden="true">🗺️</span><span data-t="wm.title"></span></button>
  <button class="mtab" id="mbTab" role="tab"><span class="ni" aria-hidden="true">⚔️</span><span data-t="menu.mb"></span></button>
  <button class="mtab" id="setBtn" role="tab"><span class="ni" aria-hidden="true">⚙️</span><span data-t="set.title"></span></button>
</nav>
<!-- טור הקיצורים (js/menu.js, ניר 2.11.2026): אייקונים קטנים עם תווית בצד, בכפר ובעולם. כל אחד פותח לשונית בתפריט. נקודה אדומה = יש מה לעשות -->
<nav class="qrail" id="qRail" data-ta="rail.group">
  <button id="gearBtnQ" class="qr" data-tab="gearBtn"><span class="ni" aria-hidden="true">🎒</span><span data-t="menu.hero"></span><i class="qrdot" hidden></i></button>
  <button id="qBtnQ" class="qr" data-tab="qBtn"><span class="ni" aria-hidden="true">📜</span><span data-t="q.log"></span><i class="qrdot" hidden></i></button>
  <button id="bookBtnQ" class="qr" data-tab="bookBtn"><span class="ni" aria-hidden="true">📖</span><span data-t="book.btn"></span><i class="qrdot" hidden></i></button>
  <button id="wMapBtnQ" class="qr wonly" data-tab="wMapBtn"><span class="ni" aria-hidden="true">🗺️</span><span data-t="wm.title"></span><i class="qrdot" hidden></i></button>
</nav>
<!-- השורה העליונה (ניר, 4.11.2026): כפתורים עגולים של "מדי פעם" באמצע למעלה, במקום הפנוי בין הקווסט למשאבים: מתנה, ביקור, איסוף, ובכפר גם האכלת חיית המחמד
     (מי נמצא כאן ובאיזה סדר: לפי העדיפות ב-js/hudrank.js). הטור בצד נשאר לקיצורים -->
<div class="vtop" id="vTop">
<button class="dgift" id="dBtn" hidden data-ta="daily.btn"><span aria-hidden="true">🎁</span><b></b></button>
<button class="dgift visbtn" id="visBtn" hidden data-ta="visit.btn"><span aria-hidden="true">🏡</span></button>
<button class="dgift welbtn" id="welBtn" hidden data-ta="wel.btn"><span aria-hidden="true">📦</span></button>
</div>
<!-- מתנה יומית שעוד לא נלקחה: כפתור עגול קטן בפינה העליונה, מתחת להשתקה. לא בסרגל, כדי שלא ידחוף כפתורים החוצה (js/daily.js) -->
<!-- ביקור אצל חבר: כפתור עגול מתחת למתנה, רק בכפר. דהוי בלי Google (js/visit.js) -->
<button class="updbtn" id="updBtn" hidden></button>   <!-- גרסה חדשה: נגיעה שומרת ומרעננת (js/update-check.js) -->
<!-- "בזמן שלא היית": כפתור קטן בצד, רק כשיש מה לאסוף. נגיעה אחת אוספת הכל (js/welcome.js) -->
<!-- היומן והשיחה עם תושב: אותו חלון, עם ✕ (js/quests.js, js/npc.js) -->
<div class="qlog win" id="qLog" hidden></div>
<div class="qlog npcdlg win" id="npcDlg" hidden></div>
<!-- ספר ההרפתקאות: יצורים, פריטים ומשאבים שנמצאו, ופרס כל כמה רשומות (js/book.js) -->
<div class="qlog win bookwin" id="bookWin" hidden></div>

<!-- משחקי השאול (js/moba.js): הניקוד והשעון למעלה, הרמה והחיים בפינה, 3 סקילים בפינה הימנית, וחלון לבחירת דמות ולסוף -->
<div class="mbhud" id="mbHud" hidden>
  <div class="mblow" id="mbLow"></div>
  <div class="mbtop"><b class="mbs0" id="mbS0">0</b><span id="mbClock">0:00</span><b class="mbs1" id="mbS1">0</b></div>
  <div class="mbme"><span class="mbpor" id="mbPor"></span><b class="mblv" id="mbLv">1</b><div class="mbbars"><div class="mbhp" id="mbHpBar"><i id="mbHp"></i><span id="mbHpN"></span></div><div class="mbxp"><i id="mbXp"></i></div></div></div>
  <div class="mbinv" id="mbInv"></div>
  <div class="mbshopbar"><span class="mbgold" id="mbGold">0</span><button class="mbquick" id="mbQuick" hidden></button><button class="mbshopb" id="mbShopB" data-ta="mb.shop"><b aria-hidden="true">🛒</b></button></div>
  <div class="mbfeed" id="mbFeed"></div>
  <button class="mbrecall" id="mbRecall" data-ta="mb.recallA"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg><span data-t="mb.recall"></span></button>
  <div class="mbresp" id="mbResp" hidden><span data-t="mb.respL"></span><b id="mbRespN"></b><i><i id="mbRespBar"></i></i></div>
  <button class="wx mbexit" id="mbExit" data-ta="mb.exit">✕</button>
  <div class="mbping" id="mbPing" role="group" data-ta="mb.ping"><button data-o="attack"><b aria-hidden="true">⚔️</b><span data-t="mb.o.attack"></span></button><button data-o="back"><b aria-hidden="true">🛡️</b><span data-t="mb.o.back"></span></button></div>
</div>
<div class="skills mbsk" id="mbSk" role="group" data-ta="sk.group" hidden></div>
<div class="ov" id="ovMbShop" hidden><div class="panel win mbshop" id="mbShop"></div></div>   <!-- חנות החפצים (js/moba-items.js) -->
<div class="ov gearov" id="ovMoba" hidden><div class="panel win mbwin" id="mbWin"></div></div>

<div class="banner" id="banner"></div>
<!-- אפליקציה מותקנת שמוחזקת לאורך: בקשה לסובב (js/pwa.js) -->
<div class="pwa-turn" id="pwaTurn"><b aria-hidden="true">📱↻</b><p data-t="pwa.turn"></p></div>

<!-- מסך הציוד והתרמיל: התרמיל, הבובה עם המשבצות, והפרטים. גוררים או לוחצים (js/gear.js) -->
<!-- חנות הריצה (js/shop.js): ציוד לריצה הזו בלבד, בזהב מהריגות -->
<div class="ov" id="ovShop" hidden><div class="win shopwin" role="dialog"></div></div>
<div class="ov gearov" id="ovGear" hidden>
  <div class="panel gearpanel win">
    <div class="ghead whd"><h2 data-t="gear.title"></h2><div class="gpages" id="gPages"></div><span id="gHero"></span><span class="bag" id="gCoins"></span><button class="gclose wx" id="gearClose" data-ta="gear.close">✕</button></div>
    <div class="gbody">
      <section class="gbag" id="gBag"><div class="ffilter" id="gTabs"></div><div class="ggrid" id="gItems"></div><div class="gacts" id="gActs"></div></section>
      <section class="gdoll" id="gSlots"></section>
      <section class="gsidep"><div class="gdetail" id="gDetail"></div><div class="gstash" id="gStash" hidden></div></section>
    </div>
    <div class="gchar" id="gChar" hidden></div>
    <div class="gtree" id="gTree" hidden></div>
  </div>
</div>

<!-- הנפחייה: Aging לציוד, לשונית כוחות (js/powers.js) ולשונית התכה (js/fuse.js). הפריטים, הסיכוי, המחיר והכפתור (js/aging.js) -->
<div class="ov gearov" id="ovForge" hidden>
  <div class="panel gearpanel win">
    <div class="ghead whd"><h2 data-t="age.title"></h2><span id="fLevel"></span><button class="gclose wx" id="forgeClose" data-ta="gear.close">✕</button></div>
    <div class="bag fres" id="fRes" role="group" data-ta="bagGroup"></div>
    <div class="ffilter" id="fTabs"></div>
    <div class="gitems" id="fItems"></div>
    <div class="gdetail" id="fDetail"></div>
  </div>
</div>

<!-- "בזמן שלא היית": חלון אחד בכניסה לכפר שאוסף הכל (js/welcome.js) -->
<div class="ov gearov" id="ovWelcome" hidden><div class="panel win dailywin welwin" id="welWin"></div></div>
<!-- מתנה יומית: לוח של 7 ימים, נפתח בכניסה הראשונה לכפר בכל יום (js/daily.js) -->
<div class="ov gearov" id="ovDaily" hidden><div class="panel win dailywin" id="dailyWin"></div></div>
<!-- ביקור אצל חבר: רשימת חברים, הכפר שלו לקריאה בלבד, ומתנה עם פתק (js/visit.js) -->
<div class="ov gearov" id="ovVisit" hidden><div class="panel win dailywin viswin" id="visitWin"></div></div>
<!-- מסחר עם חבר: הצעה (מתוך הביקור) והצעות שמחכות לי (js/trade.js) -->
<div class="ov gearov" id="ovTrade" hidden><div class="panel win dailywin viswin trdwin" id="tradeWin"></div></div>
<div class="ov gearov" id="ovEnd" hidden><div class="panel win endwin" id="endWin"></div></div>

<!-- מסך הפתיחה: מסך אחד בלי גלילה. כותרת, כפתור "יאללה" גדול בפינה של האגודל הימני, וכפתורים קטנים להגדרות. ההסבר בחלון (js/ui.js) -->
<div class="ov start" id="ovStart">
  <div class="panel spanel">
    <div class="stop">
      <button class="lang" id="helpBtn" data-t="help.btn"></button>
      <button class="lang mbbtn" id="mbBtn" data-t="mb.btn"></button>
    </div>
    <div class="smid">
      <h1 data-t="title"></h1>
      <p class="sub" data-t="tagline"></p>
    </div>
    <div class="sbot">
      <div class="sside">
        <p class="sub cloud" id="cloudLine" data-t="cloud.off"></p>
        <p class="sub savewarn" id="saveWarn" hidden></p>
        <div class="langs cloudbtns"><button class="lang" id="cloudIn" data-t="cloud.google" hidden></button><button class="lang" id="cloudOut" data-t="cloud.signout" hidden></button><button class="lang" id="pwaInstall" data-t="pwa.install" hidden></button></div>
        <p class="sub" id="pwaIos" data-t="pwa.ios" hidden></p>
      </div>
      <button class="go" id="startBtn" data-t="start"></button>
    </div>
    <p class="ver" id="verLine" dir="ltr"></p>
  </div>
</div>
<!-- איך משחקים: נפתח מכפתור במסך הפתיחה, גולל בפנים, ונסגר ב-✕, ב-Esc, בחזור ובנגיעה בחוץ (js/ui.js) -->
<div class="ov helpov" id="ovHelp" hidden>
  <div class="panel win helppanel">
    <div class="whd"><h2 data-t="help.title"></h2><button class="wx" id="helpClose" data-ta="q.close">✕</button></div>
    <ul class="rules" data-t="rules"></ul>
  </div>
</div>

<!-- בחירת דמות התחלה, רק במשחק הראשון (js/heroes.js) -->
<div class="ov" id="ovHero" hidden>
  <div class="panel heropanel">
    <h2 data-t="hero.title"></h2>
    <p class="sub" data-t="hero.sub"></p>
    <div class="cards herocards" id="heroCards"></div>
    <div class="langs"><button class="lang" id="heroSkin" data-t="hero.skin"></button></div>
  </div>
</div>

<div class="ov arov" id="ovLevel" hidden>
  <div class="panel win arwin">
    <h2 id="lvTitle" class="arhd"></h2>
    <p class="sub" data-t="pickUpgrade"></p>
    <div class="cards" id="cards"></div>
  </div>
</div>

<div class="ov arov" id="ovBoss" hidden>
  <div class="panel win arwin">
    <p class="sub" data-t="bossComing"></p>
    <h2 id="bTitle"></h2>
    <div class="learned">
      <span class="k" data-t="bossLearned"></span>
      <div id="bLearned" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>
    <div class="learned">
      <span class="k" data-t="bossPats"></span>
      <div class="chips" id="bPats"></div>
      <span id="bWeak"></span>
    </div>
    <button class="go" id="fightBtn" data-t="fight"></button>
  </div>
</div>

<!-- מסך הסוף בזירה: מסגרת עץ, כותרת עם סמל (💀 נפלת / 🏆 ניצחת, לפי .won), כרטיסים עם סמלים ופס שלל זהוב -->
<div class="ov arov" id="ovOver" hidden>
  <div class="panel win arwin">
