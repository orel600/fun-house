<!doctype html><html><head><meta charset="utf-8"><title>film</title>
<style>body{margin:0;background:#1b2130;color:#eef;font:600 13px system-ui}h2{margin:8px 12px 2px;font-size:15px}.row{display:flex;gap:6px;padding:4px 12px 8px;flex-wrap:nowrap}figure{margin:0;text-align:center}figcaption{font-size:12px;color:#b9c3dc}canvas{border-radius:6px;display:block}</style></head><body><div id="out"></div>
<script src="file:///C:/Orel claude/fh-ari-tank/js/vendor/three-bundle.js"></script><script src="file:///C:/Orel claude/fh-ari-tank/js/models3d.js"></script>
<script>
const b64buf=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer};
const parse=buf=>new Promise((ok,bad)=>new THREE.GLTFLoader().setMeshoptDecoder(THREE.MeshoptDecoder).parse(buf,'',ok,bad));
const lambert=root=>root.traverse(o=>{if(o.isMesh){const m=o.material;o.material=new THREE.MeshLambertMaterial({map:m.map,color:m.color,emissive:m.emissive,emissiveMap:m.emissiveMap,side:THREE.DoubleSide});o.frustumCulled=false}});
const texOf=b=>new Promise(ok=>{const u=URL.createObjectURL(new Blob([b64buf(b)],{type:'image/jpeg'}));new THREE.TextureLoader().load(u,t=>{t.flipY=false;t.wrapS=t.wrapT=THREE.RepeatWrapping;ok(t)})});
async function pbr(root,p){const base=root.getObjectByProperty('isMesh',true).material.map;const n=await texOf(p.n),r=await texOf(p.r);n.colorSpace=THREE.NoColorSpace;r.colorSpace=THREE.NoColorSpace;
 root.traverse(o=>{if(o.isMesh){o.material=new THREE.MeshStandardMaterial({map:base,normalMap:n,roughnessMap:r,metalness:0.2,roughness:1,side:THREE.DoubleSide});o.frustumCulled=false}})}
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.outputColorSpace=THREE.SRGBColorSpace;R.setPixelRatio(1);
function scene(pbrMode){const s=new THREE.Scene();s.background=new THREE.Color('#2b3a2c');s.add(new THREE.HemisphereLight(0xdfe6ff,0x2a2236,1.6*1.15));const l=new THREE.DirectionalLight(0xfff1dc,1.9*1.15);l.position.set(-0.5,1,0.6);s.add(l);if(pbrMode){const l2=new THREE.DirectionalLight(0xffffff,1.2);l2.position.set(1,0.5,-0.5);s.add(l2)}return s}
async function main(){
  const CFG=window.CFG,out=document.getElementById('out');
  const clips={};for(const k of ['anim_general','anim_move','anim_ranged','anim_melee']){const g=await parse(b64buf(MODELS3D[k]));for(const a of g.animations)clips[a.name]=a}
  const info=[];
  for(const row of CFG.rows){
    const gl=await parse(b64buf(row.glb));if(row.mode==='pbr')await pbr(gl.scene,row.pbr);else lambert(gl.scene);
    const prop=row.prop?await parse(b64buf(row.prop.glb)):null;if(prop)lambert(prop.scene);
    const names=new Set();gl.scene.traverse(o=>names.add(o.name));
    let ratio=null;if(row.retarget){const kk=await parse(b64buf(MODELS3D.barbarian));const kl={};kk.scene.traverse(o=>{if(o.isBone)kl[o.name]=o.position.length()});ratio={};gl.scene.traverse(o=>{if(o.isBone&&kl[o.name]>1e-4)ratio[o.name]=o.position.length()/kl[o.name]})}
    const mk=(rotOv)=>{const ch=THREE.SkeletonUtils.clone(gl.scene);if(prop)ch.traverse(o=>{if(o.isBone&&o.name===row.prop.bone){const w=prop.scene.clone(true);w.position.fromArray((rotOv&&rotOv.pos)||row.prop.pos||[0,0,0]);w.quaternion.fromArray((rotOv&&rotOv.rot)||row.prop.rot||[0,0,0,1]);w.scale.setScalar(row.prop.scale||1);o.add(w)}});return ch};
    const filt=(a)=>{let tr=a.tracks.filter(t=>{const n=t.name.split('.')[0];return names.has(n)});if(ratio)tr=tr.map(t=>{const [n,p]=t.name.split('.');if(p==='position'&&ratio[n]){const v=t.values.slice();for(let i=0;i<v.length;i++)v[i]*=ratio[n];return new THREE.VectorKeyframeTrack(t.name,t.times,v)}return t});return {clip:new THREE.AnimationClip(a.name,a.duration,tr),total:a.tracks.length,kept:tr.length}};
    const h=(()=>{const c=mk(),mx=new THREE.AnimationMixer(c);const f=filt(clips.Idle_A);if(f.kept)mx.clipAction(f.clip).play();mx.update(0);c.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(c);return b.max.y-b.min.y})();
    const sc=row.scaleH?row.scaleH/h:(row.scale||1);
    const hd=document.createElement('h2');hd.textContent=row.label+'  | model height '+h.toFixed(2)+' (scale '+sc.toFixed(2)+')';out.append(hd);
    const rowEl=document.createElement('div');rowEl.className='row';out.append(rowEl);
    const bb=new THREE.Box3().setFromObject(gl.scene);let tc=0;gl.scene.traverse(o=>{if(o.isMesh){const g=o.geometry;tc+=(g.index?g.index.count:g.attributes.position.count)/3}});const rinfo={label:row.label,height:h,scale:sc,clips:{},bbox:[bb.min.toArray().map(v=>+v.toFixed(3)),bb.max.toArray().map(v=>+v.toFixed(3))],tris:tc};
    for(const [an,at,vdeg,vaz] of (row.views||row.clips)){if(vdeg!==undefined){row.deg=vdeg;row.az=vaz}const f=an==='REST'?{kept:0,total:0}:filt(clips[an]);rinfo.clips[an]=f.kept+'/'+f.total;
      const ov=row.prop&&row.prop.byClip&&row.prop.byClip[an];const s=scene(row.mode==='pbr'),ch=mk(ov);ch.scale.setScalar(sc);ch.rotation.y=(row.rotY??-0.3);s.add(ch);const mx=new THREE.AnimationMixer(ch);if(f.kept)mx.clipAction(f.clip).play();mx.update(at);if(row.prop&&row.wantHand){ch.updateMatrixWorld(true);let hb=null;ch.traverse(o=>{if(o.isBone&&o.name===row.prop.bone)hb=o});if(hb){const q=hb.getWorldQuaternion(new THREE.Quaternion()),pp=hb.getWorldPosition(new THREE.Vector3());const inv=ch.quaternion.clone().invert();rinfo.hand=rinfo.hand||{};rinfo.hand[an+'@'+at]={q:q.premultiply(inv).toArray(),p:pp.sub(ch.position).applyQuaternion(inv).divideScalar(sc).toArray()}}}if(row.proc){const p=at,hop=Math.abs(Math.sin(p*Math.PI)),sq=Math.cos(p*2*Math.PI);ch.position.y=hop*0.25*sc*(row.pamp||1);ch.scale.set(sc*(1+0.09*sq),sc*(1-0.12*sq),sc*(1+0.09*sq));ch.rotation.z=0.1*Math.sin(p*2*Math.PI);ch.rotation.y+=0.12*Math.sin(p*2*Math.PI)}ch.updateMatrixWorld(true);
      const zz=row.zoom||1,t=(row.deg||50)*Math.PI/180,cam=new THREE.OrthographicCamera(-1.3/zz,1.3/zz,2.1/zz,-1.3/zz,0.01,100),C=new THREE.Vector3(0,row.cy??0.9,0);cam.position.copy(C).add(new THREE.Vector3(Math.sin(row.az||0)*Math.cos(t),Math.sin(t),Math.cos(row.az||0)*Math.cos(t)).multiplyScalar(10));cam.lookAt(C);cam.updateProjectionMatrix();
      R.setSize(230,300);R.render(s,cam);const c=document.createElement('canvas');c.width=230;c.height=300;c.getContext('2d').drawImage(R.domElement,0,0);const fg=document.createElement('figure');fg.append(c);const cp=document.createElement('figcaption');cp.textContent=an+' '+at+'s ['+rinfo.clips[an]+' tracks]';fg.append(cp);rowEl.append(fg)}
    info.push(rinfo)}
  window.INFO=info;document.title='ready';
}
main().catch(e=>{document.title='ERR '+e.message;console.error(e)});
</script></body></html>
