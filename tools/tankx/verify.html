<!doctype html><html><head><meta charset="utf-8"><title>tankx verify</title>
<!-- בדיקת tankX לכל קליפ ברשימה (ARI, 9.11.2026): נטען מ-verify.js. בלי ציור: רק מיקסר ומדידות. חוסר קליפ = MISSING (לא כישלון). -->
<script src="../../js/vendor/three-bundle.js"></script><script src="../../js/models3d.js"></script>
<script>function m3dPut(k,b){MODELS3D[k]=b}</script>
<script src="../../js/m3d/tankX.js"></script><script src="../../js/m3d/w_item_tankXHammer.js"></script><script src="../../js/retarget-tracks.js"></script>
</head><body><script>
const b64buf=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer};
const parse=buf=>new Promise((ok,bad)=>new THREE.GLTFLoader().setMeshoptDecoder(THREE.MeshoptDecoder).parse(buf,'',ok,bad));
(async()=>{try{
 const mine=await parse(b64buf(MODELS3D.tankX)),ref=await parse(b64buf(MODELS3D.barbarian)),ham=await parse(b64buf(MODELS3D.w_item_tankXHammer));
 const ratios=RETARGET.ratios(mine.scene,ref.scene),rep=RETARGET.report(ratios);
 const clips={};for(const k of ['anim_general','anim_move','anim_ranged','anim_melee']){if(!MODELS3D[k])continue;const g=await parse(b64buf(MODELS3D[k]));for(const a of g.animations)clips[a.name]=a}
 const names=new Set();mine.scene.traverse(o=>names.add(o.name));
 const mkBox=()=>{const ch=THREE.SkeletonUtils.clone(mine.scene);return ch};
 const out={ratios:rep,bones:{model:names.size},clips:{}};
 // hammer attaches?
 out.hammerBone=names.has(TANKX.bone)?'ok':'MISSING '+TANKX.bone;
 let rest;{const ch=mkBox();ch.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(ch);rest=b.max.y-b.min.y;out.restHeight=+rest.toFixed(3)}
 for(const cn of TANKX.verifyClips){const a=clips[cn];if(!a){out.clips[cn]={status:'MISSING'};continue}
  const kept=a.tracks.filter(t=>names.has(t.name.split('.')[0]));const clip=RETARGET.apply(new THREE.AnimationClip(a.name,a.duration,kept),ratios);
  const ch=mkBox(),mx=new THREE.AnimationMixer(ch),act=mx.clipAction(clip);act.play();const hs=[],bad=[];
  for(let i=0;i<=8;i++){mx.setTime(a.duration*i/8);ch.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(ch);const h=b.max.y-b.min.y;hs.push(+h.toFixed(3));if(!isFinite(h)||h<0.35*rest||h>2.2*rest)bad.push(i)}
  const feet=[];ch.traverse(o=>{if(o.isBone&&/^foot/.test(o.name)){const p=o.getWorldPosition(new THREE.Vector3());feet.push(+p.y.toFixed(3))}});
  out.clips[cn]={status:bad.length||kept.length<a.tracks.length*0.9?'FAIL':'PASS',tracks:kept.length+'/'+a.tracks.length,height_min_max:[Math.min(...hs),Math.max(...hs)],badSamples:bad,feetYEnd:feet};}
 window.RESULT=out;document.title='ready'}catch(e){document.title='ERR '+e.message;console.error(e)}})();
</script></body></html>
