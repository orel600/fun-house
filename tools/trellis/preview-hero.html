<!doctype html><html><head><meta charset="utf-8"><title>Hero model vs current</title>
<!-- דמות חדשה (TRELLIS + reskin) מול הדמות הנוכחית, עם הקליפים האמיתיים של KayKit, בתאורה של render3d.js (ARI, 9.11.2026). נטען מ-shoot-hero.js: window.NEW = {glb: base64, base: מפתח הדמות הנוכחית ב-MODELS3D, bow: true/false} -->
<style>body{margin:0;background:#1b2130;color:#eef;font:600 13px system-ui;width:1500px}h2{margin:8px 12px 2px;font-size:15px}.row{display:flex;gap:6px;padding:4px 12px 8px}
figure{margin:0;text-align:center}figcaption{font-size:12px;color:#b9c3dc}canvas{border-radius:6px;display:block}</style></head><body><div id="out"></div>
<script src="../../js/vendor/three-bundle.js"></script><script src="../../js/models3d.js"></script>
<script>
const b64buf=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer};
const parse=buf=>new Promise((ok,bad)=>new THREE.GLTFLoader().setMeshoptDecoder(THREE.MeshoptDecoder).parse(buf,'',ok,bad));
const lambert=root=>root.traverse(o=>{if(o.isMesh){const m=o.material;o.material=new THREE.MeshLambertMaterial({map:m.map,color:m.color,emissive:m.emissive,emissiveMap:m.emissiveMap,side:THREE.DoubleSide});o.frustumCulled=false}});
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.outputColorSpace=THREE.SRGBColorSpace;R.setPixelRatio(1);
function scene(){const s=new THREE.Scene();s.background=new THREE.Color('#2b3a2c');s.add(new THREE.HemisphereLight(0xdfe6ff,0x2a2236,1.6*1.15));const l=new THREE.DirectionalLight(0xfff1dc,1.9*1.15);l.position.set(-0.5,1,0.6);s.add(l);return s}
async function main(){
  const N=window.NEW,mine=await parse(b64buf(N.glb));lambert(mine.scene);const cur=await parse(b64buf(MODELS3D[N.base]));lambert(cur.scene);
  const bow=N.bow?await parse(b64buf(MODELS3D.w_bow_A_withString)):null;if(bow)lambert(bow.scene);
  const clips={};for(const k of ['anim_general','anim_move','anim_ranged','anim_melee']){const g=await parse(b64buf(MODELS3D[k]));for(const a of g.animations)clips[a.name]=new THREE.AnimationClip(a.name,a.duration,a.tracks.filter(t=>{const [n,p]=t.name.split('.');return !/IK|control/.test(n)&&(p==='quaternion'||p==='position'&&/^(root|hips|upperleg)/.test(n))}))}
  const out=document.getElementById('out');
  const mk=base=>{const ch=THREE.SkeletonUtils.clone(base.scene);ch.traverse(o=>{if(o.isBone&&o.name==='handslotl'&&bow){const w=bow.scene.clone(true);w.quaternion.set(0,-0.7071,0,0.7071);o.add(w)}});return ch};
  const ANIMS=[['Idle_A',0.4],['Running_A',0.2],['Running_A',0.45],['Ranged_Bow_Draw',0.5],['Ranged_Bow_Release',0.2],['Death_A',0.9]];
  const poseH=base=>{const c=mk(base),mx=new THREE.AnimationMixer(c);mx.clipAction(clips.Idle_A).play();mx.update(0);c.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(c);return b.max.y-b.min.y};
  const hs={cur:poseH(cur),mine:poseH(mine)};console.log('HEIGHTS',JSON.stringify(hs));
  for(const [vt,deg] of [['Game camera (52 deg)',52],['Front (14 deg)',14]]){const h=document.createElement('h2');h.textContent=vt+'  | top row: CURRENT ('+N.base+')  | bottom row: NEW';out.append(h);
    for(const [who,base] of [['cur',cur],['mine',mine]]){const row=document.createElement('div');row.className='row';out.append(row);
      for(const [an,at] of ANIMS){const s=scene(),ch=mk(base),sc=hs.cur/hs[who];ch.scale.setScalar(sc);ch.rotation.y=deg>30?-0.3:-0.5;s.add(ch);const mx=new THREE.AnimationMixer(ch);mx.clipAction(clips[an]).play();mx.update(at);ch.updateMatrixWorld(true);
        const t=deg*Math.PI/180,cam=new THREE.OrthographicCamera(-1.25,1.25,1.9,-1.3,0.01,100),C=new THREE.Vector3(0,0.85,0);cam.position.copy(C).add(new THREE.Vector3(0,Math.sin(t),Math.cos(t)).multiplyScalar(10));cam.lookAt(C);cam.updateProjectionMatrix();
        R.setSize(230,300);R.render(s,cam);const c=document.createElement('canvas');c.width=230;c.height=300;c.getContext('2d').drawImage(R.domElement,0,0);const f=document.createElement('figure');f.append(c);const cp=document.createElement('figcaption');cp.textContent=(who==='cur'?'current':'NEW')+' · '+an+' '+at+'s';f.append(cp);row.append(f)}}}
  document.title='ready';
}
main().catch(e=>{document.title='ERR '+e.message;console.error(e)});
</script></body></html>
