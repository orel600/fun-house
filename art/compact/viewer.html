<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#dfe5ec;color:#152031;font-family:Arial}#label{position:absolute;left:16px;top:12px;font-size:17px}</style><div id="label"></div><script src="../../js/vendor/three-bundle.js"></script><script>
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(400,440);renderer.setPixelRatio(1);renderer.setClearColor('#dfe5ec');document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(34,400/440,0.01,100);camera.position.set(4,2.7,6);camera.lookAt(0,1.25,0);scene.add(new THREE.HemisphereLight(0xffffff,0x667080,2.5));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-3,6,5);scene.add(light);scene.add(new THREE.GridHelper(6,12,0xb4c0cd,0xcbd3dd));
let model,mixer,models={},clips={},props={};
const parse=async p=>{const b=await (await fetch(p)).arrayBuffer();return await new Promise((r,e)=>new THREE.GLTFLoader().setMeshoptDecoder(THREE.MeshoptDecoder).parse(b,'',r,e))};
window.ready=(async()=>{for(const n of ['Tank','Warrior','Hunter','Mage','Assassin'])models[n]=await parse(n+'Hero.glb');for(const n of ['anim_general','anim_move','anim_moveAdv','anim_melee','anim_ranged','anim_skel']){const g=await parse('clips/'+n+'.glb');for(const a of g.animations)clips[a.name]=new THREE.AnimationClip(a.name,a.duration,a.tracks.filter(t=>{const [nm,p]=t.name.split('.');return !/IK|control/.test(nm)&&(p==='quaternion'||p==='position'&&/^(root|hips|upperleg)/.test(nm))}))}for(const n of ['w_item_stoneHammer','blade','w_bow_A_withString','staff','w_staff_A'])props[n]=(await parse(n+'.glb')).scene;return true})();
window.show=(name,clip,f)=>{if(model)scene.remove(model);model=THREE.SkeletonUtils.clone(models[name].scene);model.scale.setScalar(2.7/new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3()).y);scene.add(model);const propKey={Tank:'w_item_stoneHammer',Warrior:'blade',Hunter:'w_bow_A_withString',Mage:'w_staff_A',Assassin:'blade'}[name];const prop=props[propKey].clone(true);const left=name==='Hunter';let hand;model.traverse(o=>{if(o.isBone&&o.name===(left?'handslotl':'handslotr'))hand=o});if(hand){if(left)prop.quaternion.set(0,-.7071,0,.7071);hand.add(prop)}mixer=new THREE.AnimationMixer(model);const a=mixer.clipAction(clips[clip]);a.setLoop(THREE.LoopOnce,1);a.clampWhenFinished=true;a.play();mixer.setTime(f*clips[clip].duration);model.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(model,true);document.getElementById('label').textContent=name+' / '+clip+' / '+Math.round(f*100)+'%';renderer.render(scene,camera);return {min:b.min.toArray(),max:b.max.toArray(),duration:clips[clip].duration}};
</script>
