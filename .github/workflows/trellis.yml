# כלי זמני: הופך ציורי דמויות למודלים צבועים ב-TRELLIS (Hugging Face), ושומר את התוצאה בחזרה בענף.
# רץ רק בענף feature/hf-trellis, או ידנית. לא נוגע במשחק.
name: TRELLIS (תלת-ממד מ-Hugging Face)
# רץ רק כשמשנים את tools/trellis/go.txt בענף הזה, כדי לא לבזבז את המכסה היומית של Hugging Face על כל דחיפה
on:
  push:
    branches: [feature/hf-trellis]
    paths: ['tools/trellis/go.txt']
permissions:
  contents: write
jobs:
  trellis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install gradio_client
      - name: נשקים ומגנים (משימה נ)
        continue-on-error: true
        run: |
          for id in ironStaff goldStaff starStaff skyBow stormBow shield3 shield4; do
            [ -f tools/trellis/out/weapons/$id.glb ] || python tools/trellis/weapons.py $id || echo "נכשל: $id"
          done
          ls -la tools/trellis/out/weapons || true
      - name: שמירה בענף
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/trellis/out || true
          git diff --cached --quiet && echo "אין תוצאות" && exit 0
          git commit -m "TRELLIS: תוצאות"; git push
