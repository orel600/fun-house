# בדיקת המשחק: רצה לבד על כל בקשת מיזוג (PR) ועל כל שינוי ב-main.
# הבוט מ-tools/check.js משחק שלוש ריצות עד שהבוס מובס: שתיים בתלת-ממד, השנייה בדו-ממד, והאחרונה באנגלית. הדוח מופיע בסיכום של הריצה, וצילומי המסך מצורפים לה.
name: בדיקת המשחק

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # שתי ריצות בתלת-ממד בלי כרטיס גרפי לוקחות כ-4 דקות כל אחת
    defaults:
      run:
        shell: bash
    env:
      PW_CHANNEL: chrome   # Chrome כבר מותקן במחשבים של GitHub. להוריד דפדפן לוקח שם יותר מעשר דקות
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: google-chrome --version
      - name: בוט משחק עד שהבוס מובס
        run: |
          for seed in 7 123 2026; do
            shots=""; [ "$seed" = 7 ] && shots="--shots"
            lang=""; [ "$seed" = 2026 ] && lang="--lang en"
            gfx=""; [ "$seed" = 123 ] && gfx="--gfx 2d"
            echo "### seed $seed $lang $gfx" >> "$GITHUB_STEP_SUMMARY"
            node tools/check.js --seed $seed $shots $lang $gfx | tee -a "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: tools/shots
          if-no-files-found: ignore
