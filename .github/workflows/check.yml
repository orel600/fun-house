# בדיקת המשחק: רצה לבד על כל בקשת מיזוג (PR) ועל כל שינוי ב-main.
# הבוט מ-tools/check.js משחק שלוש ריצות במקביל עד שהבוס מובס: בתלת-ממד, בדו-ממד, ובאנגלית (בתלת-ממד). הדוח מופיע בסיכום של הריצה, וצילומי המסך מצורפים לה.
name: בדיקת המשחק

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # שלוש ריצות במקביל, כל אחת במחשב משלה: ריצה של שש דקות משחק בתלת-ממד בלי כרטיס גרפי לוקחת כמה דקות
    strategy:
      fail-fast: false
      matrix:
        include:
          - {seed: 7, flags: "--shots"}
          - {seed: 123, flags: "--gfx 2d"}
          - {seed: 2026, flags: "--lang en"}
    name: seed ${{ matrix.seed }} ${{ matrix.flags }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      PW_CHANNEL: chrome   # Chrome כבר מותקן במחשבים של GitHub. להוריד דפדפן לוקח שם יותר מעשר דקות
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: google-chrome --version
      - name: בוט משחק עד שהבוס מובס
        run: |
          echo "### seed ${{ matrix.seed }} ${{ matrix.flags }}" >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          node tools/check.js --seed ${{ matrix.seed }} ${{ matrix.flags }} | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && matrix.seed == 7
        with:
          name: screenshots
          path: tools/shots
          if-no-files-found: ignore
